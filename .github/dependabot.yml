version: 2
updates:
  # Rust Cargo dependency automated update configuration (checked weekly)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10

  # GitHub Actions dependency automated update configuration (checked weekly)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

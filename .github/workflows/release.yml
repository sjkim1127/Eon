name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Run all tests
        run: cargo test --workspace --locked

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: test
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Synchronize workspace version from tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/sync_release_version.py "$VERSION"
          cargo metadata --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 >/dev/null
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate staged release packages
        run: |
          set -euo pipefail
          python3 scripts/sync_release_version.py "$VERSION" --check
          bash scripts/package_workspace.sh --allow-dirty

          unexpected_changes="$(git diff --name-only | grep -vE '^(Cargo.toml|Cargo.lock)$' || true)"
          if [[ -n "$unexpected_changes" ]]; then
            echo "Unexpected files changed while preparing the release:" >&2
            echo "$unexpected_changes" >&2
            exit 1
          fi

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish_workspace.sh

  build-cli:
    name: Build CLI Binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build Eon CLI (Release)
        run: cargo build --release --bin eon
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: eon-cli-linux-x86_64
          path: target/release/eon

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-crates, build-cli]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes from git log
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n1)

          if [[ -z "$PREV_TAG" ]]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md

          FEATURES=$(git log $RANGE --oneline --no-merges | grep "^[a-f0-9]* feat" || true)
          FIXES=$(git log $RANGE --oneline --no-merges | grep "^[a-f0-9]* fix" || true)
          PERF=$(git log $RANGE --oneline --no-merges | grep "^[a-f0-9]* perf" || true)
          REFACTOR=$(git log $RANGE --oneline --no-merges | grep "^[a-f0-9]* refactor" || true)
          DOCS=$(git log $RANGE --oneline --no-merges | grep "^[a-f0-9]* docs" || true)
          OTHERS=$(git log $RANGE --oneline --no-merges | grep -vE "^[a-f0-9]* (feat|fix|perf|refactor|docs|chore|ci)" || true)

          [[ -n "$FEATURES" ]] && echo "### ✨ Features" >> release_notes.md && echo "$FEATURES" | while read -r line; do echo "- $line"; done >> release_notes.md && echo "" >> release_notes.md
          [[ -n "$FIXES" ]] && echo "### 🐛 Bug Fixes" >> release_notes.md && echo "$FIXES" | while read -r line; do echo "- $line"; done >> release_notes.md && echo "" >> release_notes.md
          [[ -n "$PERF" ]] && echo "### ⚡ Performance" >> release_notes.md && echo "$PERF" | while read -r line; do echo "- $line"; done >> release_notes.md && echo "" >> release_notes.md
          [[ -n "$REFACTOR" ]] && echo "### ♻️ Refactor" >> release_notes.md && echo "$REFACTOR" | while read -r line; do echo "- $line"; done >> release_notes.md && echo "" >> release_notes.md
          [[ -n "$DOCS" ]] && echo "### 📝 Docs" >> release_notes.md && echo "$DOCS" | while read -r line; do echo "- $line"; done >> release_notes.md && echo "" >> release_notes.md
          [[ -n "$OTHERS" ]] && echo "### 🔧 Other Changes" >> release_notes.md && echo "$OTHERS" | while read -r line; do echo "- $line"; done >> release_notes.md && echo "" >> release_notes.md

          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          if [[ -n "$PREV_TAG" ]]; then
            echo "**Full changelog**: https://github.com/sjkim1127/Eon/compare/${PREV_TAG}...${TAG}" >> release_notes.md
          fi
          cat release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Eon ${{ github.ref_name }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

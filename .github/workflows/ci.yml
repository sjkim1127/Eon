name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run Tests & Generate Coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  release-preflight:
    name: Release Package Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Validate release helper syntax
        run: |
          bash -n \
            scripts/package_workspace.sh \
            scripts/publish_workspace.sh
          python3 -m py_compile \
            scripts/sync_release_version.py
      - name: Validate lockstep versions
        run: python3 scripts/sync_release_version.py --check
      - name: Validate Cargo.lock
        run: |
          cargo metadata --locked --format-version 1 >/dev/null
          git diff --exit-code -- Cargo.lock
      - name: Package publishable workspace crates
        run: bash scripts/package_workspace.sh

  cli-build:
    name: CLI Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Build Eon CLI (Release)
        run: cargo build --release --bin eon
      - name: Smoke Test Eon CLI
        run: |
          ./target/release/eon --version
          ./target/release/eon --help
          ./target/release/eon analyze --birth "1990-05-15 10:30" --gender m
          ./target/release/eon prompt --birth "1990-05-15 10:30" --system
